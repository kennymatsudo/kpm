appId: com.kennymatsudo.kpm
productName: "KPM - Planning Workbench"

# Directories
directories:
  buildResources: assets
  output: release

# Files to include in the app
files:
  - dist/**/*
  - node_modules/**/*
  # Exclude documentation and metadata
  - "!node_modules/**/README*"
  - "!node_modules/**/CHANGELOG*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/.github/**"
  - "!**/*.map"
  # Exclude TypeScript files (not needed at runtime)
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.tsbuildinfo"
  - "!node_modules/**/tsconfig.json"
  # Exclude test files
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  # Exclude documentation directories
  - "!node_modules/**/docs/**"
  # Exclude config files
  - "!node_modules/**/.eslintrc*"
  - "!node_modules/**/.prettierrc*"
  # Exclude license files (large text files, not needed for app functionality)
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/LICENCE*"
  # Exclude native module sources and non-target prebuilds
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/keytar/src/**"
  - "!node_modules/keytar/binding.gyp"
  - "!node_modules/keytar/keytar.d.ts"
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/scripts/**"
  - "!node_modules/node-pty/deps/**"
  - "!node_modules/node-pty/prebuilds/darwin-x64/**"
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/prebuilds/win32-x64/**"

# Native modules need to be unpacked from ASAR for proper loading
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/keytar/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  - "node_modules/@openai/codex-*/vendor/**"
  - "**/*.node"

# Rebuild native modules for Electron
npmRebuild: true
nodeGypRebuild: false

# macOS configuration
# Builds are ad-hoc signed and not notarized — no Apple Developer account
# needed. Locally built apps are never quarantined, so Gatekeeper does not
# check them.
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
